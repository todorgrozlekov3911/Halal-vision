# Shared settings — every machine loads this first.
# Precedence: shared.yaml < <machine>.yaml < --set key.path=value
# All temporal rules are in seconds, compared against Frame.ts (decision #30).

detector:
  model: yolo26n-seg.pt
  tracker: botsort          # tuned on teacher labels, eval/sweep.py 2026-11-01: fewer ID switches than bytetrack, same cover | bytetrack = fast | botsort_reid = appearance ReID, slower
  conf: 0.1                 # tuned on teacher labels, eval/sweep.py 2026-11-01 (was 0.25): weak detections are covered too; misses cost more than false covers
  imgsz: [512, 896]         # [height, width], 16:9 like the video; tuned on teacher labels, eval/sweep.py 2026-11-01: missed people 2.0% -> 0.6% vs 384x640 (18.7 ms on the Intel NPU)
  merge_inside: 0.7         # an ID-less detection with this share of its mask on a kept person's mask is a duplicate
                            # of them (YOLO26 has no NMS): its mask joins theirs. Masks, not boxes: someone standing
                            # behind a person is never folded into them. 0 = off

timing:
  mask_hold_seconds: 0.3          # keep drawing a person the detector missed this long, at their last speed (tuned on teacher labels, eval/sweep.py 2026-11-01, was 0.5)
  mask_smooth_seconds: 0.0        # running average of mask shapes over this long; 0 = masks follow people directly (tuned on teacher labels, eval/sweep.py 2026-11-01, was 0.15)
  gap_reverify_seconds: 0.15      # unseen longer -> back to concealed until re-verified # any time interval report for new id bigger than this gap is re-checked for existing confirmation / metadata on the face
  confirm_track_seconds: 0.1      # a new track stays ID-less (concealed, not identified) this long, so one-frame flickers never get an ID
  track_buffer_seconds: 2.5       # tracker keeps a lost person's ID this long; identity forgets them after it too (tuned on teacher labels, eval/sweep.py 2026-11-01, was 1.5)
  recheck_whitelist_seconds: 1.0
  recheck_gender_seconds: 2.0
  retry_unsure_seconds: 0.3       # time interval for retrying to gain metadata for identity with terrible tresholds -> for instance a face below <min_face_px>
  fade_out_seconds: 0.2           # fade when lifting a conceal ! NOTE: fading is for reviewing someone "white listed" -> as the policy of the system is that we "hide" any entity that is not yet identified

policy:
  viewer_profile: male      # only profile for now (decision #23)
  conceal_style: niqab      # full cover until the eye-slit task (decision #33)
  overlap_iou: 0.1          # box overlap that counts as a crossing

render:
  mask_grow_fraction: 0.06       # grow each covered person's mask by this share of their box height (hair, loose edges; tuned on teacher labels, eval/sweep.py 2026-11-01, was 0.04)
  mask_grow_min_fraction: 0.01   # ...but by at least this share of the frame height (far, small people)
  edge_fade: 64                  # soft outer edge: mask certainty levels just below the cut (128) that fade out; 0 = hard edge
  niqab_color: [26, 22, 20]      # niqab: BGR, near-black with a faint blue
  outline_fraction: 0.0025       # outline around each covered person, as a share of the frame height (~3 px at 1080p); 0 = none
  outline_color: [110, 110, 110] # BGR
  min_person_height: 0.11        # cover people at least this share of the frame height (~120 px at 1080p; tuned on teacher labels, eval/sweep.py 2026-11-01, was 0.12): far people and most
                                 # false detections are small. LEAK TRADE-OFF (decided for now): people further away are shown
  blur_rows: 36                  # blur: shrink the frame to this many rows, then enlarge; fewer = stronger
  pixelate_rows: 32              # pixelate: blocks per frame height; fewer = bigger blocks
  solid_color: [128, 128, 128]   # solid: BGR fill colour

identity:
  face_model: buffalo_l     # intel overrides to buffalo_s
  min_face_px: 32           # smaller faces give no evidence 
  face_det_size: 320        # face detector input (square); faces are looked for in person boxes
  face_det_thresh: 0.5      # face detector confidence to report a face
  face_threads: 2           # CPU threads per face model, leaving cores for the detector
  assign_own_min: 0.6       # T17: a face belongs to a person when at least this share of it lies on their mask...
  assign_other_max: 0.3     # ...at most this share on anyone else's (else ambiguous: no evidence)
  assign_grow_cells: 1      # person masks grown by this many mask cells before the test (small faces, edges)
  head_zone: 0.35           # the face centre must be in this top share of the person's box (not a carried child)

fail_state:
  pipeline_break_image: assets/failsafe.jpeg   # relative to system_configurations/
  hold_before_break_image: 0.5
  abort_after: 5.0
