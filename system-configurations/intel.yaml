# Intel laptop (iGPU / NPU via OpenVINO). Values here override shared.yaml.

machine: intel
expected_fps: 15            # gate M1 target; used to convert track_buffer_seconds to frames

detector:
  device: intel:gpu         # iGPU vs NPU — open item, decided in T14
  half: false
  imgsz: [384, 640]         # [height, width]: 16:9 like the video, no padding (416x416 wasted 40% on bars and missed far people)

identity:
  face_model: buffalo_s     # lighter face stack for the weaker machine